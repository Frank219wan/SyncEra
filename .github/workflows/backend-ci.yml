name: Full-stack contract CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run backend tests
        run: python -m pytest tests -q

      - name: Verify FastAPI app import
        run: python -c "from app.main import app; assert app is not None"

      - name: Verify runtime OpenAPI and P0 routes
        run: |
          python - <<'PY'
          from app.main import app

          paths = app.openapi()['paths']
          required = {
              'get': {
                  '/api/v1/health',
                  '/api/v1/explore/bubbles',
                  '/api/v1/trends/roles',
                  '/api/v1/trends/skills',
                  '/api/v1/roles/{role_id}',
                  '/api/v1/roles/{role_id}/tasks',
                  '/api/v1/evidence/{evidence_id}',
              },
              'post': {
                  '/api/v1/profiles/normalize',
                  '/api/v1/profiles/upload',
                  '/api/v1/profiles/confirm',
                  '/api/v1/recommendations',
                  '/api/v1/learning/skill-map',
                  '/api/v1/learning/roadmap',
              },
          }
          missing = sorted(
              f'{method.upper()} {path}'
              for method, expected in required.items()
              for path in expected
              if method not in paths.get(path, {})
          )
          assert not missing, f'Missing P0 routes: {missing}'
          print(f'Runtime OpenAPI generated; {sum(map(len, required.values()))} P0 routes found.')
          PY

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend contract tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  individual-contract:
    name: Individual live API contract
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run normalize-to-roadmap live contract
        shell: bash
        run: |
          AI_ADAPTER_MODULE=futureproof_ai.futureproof_adapter \
            python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null
          node --test tests/live-api-contract.test.mjs
