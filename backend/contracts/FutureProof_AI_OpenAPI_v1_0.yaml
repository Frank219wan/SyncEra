openapi: 3.0.3
info:
  title: FutureProof AI — Unified REST Contract
  version: 1.0.0
  description: Proposed development specification aligned with FutureProof AI PRD v1.3. Not a claim that
    endpoints already exist. Synthetic fixture values are illustrative, not job-market evidence.
servers:
- url: http://localhost:8000/api/v1
  description: Local FastAPI
- url: https://YOUR-REPLIT-DEPLOYMENT/api/v1
  description: Replace before delivery; do not claim published URL exists
