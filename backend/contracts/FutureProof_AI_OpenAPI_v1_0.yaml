    get:
      tags:
      - Public Discovery
      summary: DOSM occupation-group and industry market context
      operationId: get_market_radar
      description: Explicitly enabled DOSM JMI and QES view. Occupation groups do not provide named position skill requirements and its snapshot ID cannot be used for recommendations.
      parameters:
      - in: query
        name: period
        required: false
        schema:
          type: string
          pattern: '^[0-9]{4}-Q[1-4]$'
      responses:
        '200':
          description: Prepared DOSM market view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketRadarEnvelope'
        '400':
