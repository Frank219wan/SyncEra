name: Cross-stack CI

on:
  pull_request:
    branches: [main, feature/tech-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install frontend from lockfile
        run: pnpm install --frozen-lockfile
      - name: Frontend tests and production build
        run: pnpm test && VITE_API_MODE=real pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Start same-origin web and API server
        working-directory: backend
        env:
          AI_ADAPTER_MODULE: futureproof_ai.futureproof_adapter
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/syncera-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/syncera-api.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/syncera-api.log"
          exit 1
      - name: Verify frontend routes and API on one origin
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'FutureProof'
          curl --fail --silent http://127.0.0.1:8000/individual/recommendations | grep -q 'FutureProof'
          CROSS_STACK_API_URL=http://127.0.0.1:8000 node --experimental-strip-types --test tests/cross-stack.test.ts
